<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Studio Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#E5E5E8" />
    </radialGradient>
    
    <!-- Soft Ground Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20, 20, 30, 0.32)" />
      <stop offset="60%" stop-color="rgba(20, 20, 30, 0.10)" />
      <stop offset="100%" stop-color="rgba(20, 20, 30, 0.0)" />
    </radialGradient>

    <!-- Fabric Gradients -->
    <linearGradient id="maroonTee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801522" />
      <stop offset="40%" stop-color="#6B0F1A" />
      <stop offset="100%" stop-color="#4A0A12" />
    </linearGradient>

    <linearGradient id="charcoalShorts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A40" />
      <stop offset="60%" stop-color="#222226" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <linearGradient id="foldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Soft Studio Ground Shadow -->
  <ellipse cx="512" cy="740" rx="380" ry="90" fill="url(#groundShadow)" />

  <!-- Bottom Folded Shorts (Dark Charcoal) -->
  <g id="folded-shorts" transform="translate(230, 480)">
    <rect x="0" y="0" width="564" height="210" rx="28" fill="url(#charcoalShorts)" />
    <!-- Drawstring / Waistband Accent -->
    <path d="M 40 30 Q 282 15 524 30" fill="none" stroke="#2B2B30" stroke-width="8" />
    <line x1="282" y1="20" x2="270" y2="75" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="282" y1="20" x2="295" y2="80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <!-- Shorts Fold Lines -->
    <path d="M 0 105 H 564" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />
    <path d="M 28" y1="210" x2="536" y2="210" stroke="rgba(0,0,0,0.3)" stroke-width="6" />
  </g>

  <!-- Top Folded Performance T-Shirt (Maroon #6B0F1A) -->
  <g id="folded-tshirt" transform="translate(260, 270)">
    <rect x="0" y="0" width="504" height="270" rx="26" fill="url(#maroonTee)" stroke="#520A13" stroke-width="2" />
    <!-- Collar Line -->
    <path d="M 172 0 C 172 65 332 65 332 0" fill="none" stroke="#9E1D2D" stroke-width="12" />
    <path d="M 172 0 C 172 65 332 65 332 0" fill="none" stroke="#4A0A12" stroke-width="4" />
    <!-- Neatly Folded Sleeve Accents -->
    <path d="M 0 40 L 90 270" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="4" />
    <path d="M 504 40 L 414 270" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="4" />
    <!-- Center Crease Specular Highlight -->
    <rect x="0" y="130" width="504" height="140" fill="url(#foldHighlight)" opacity="0.4" rx="10" />
    <!-- Subtle Seam Stitching -->
    <line x1="30" y1="250" x2="474" y2="250" stroke="#9E1D2D" stroke-width="3" stroke-dasharray="8 6" />
  </g>

  <!-- Specular Reflection Highlight -->
  <path d="M 280 272 L 490 272" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
</svg>
