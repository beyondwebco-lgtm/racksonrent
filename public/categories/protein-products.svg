<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Studio Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#E2E2E6" />
    </radialGradient>
    
    <!-- Ground Shadows -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20, 20, 30, 0.32)" />
      <stop offset="60%" stop-color="rgba(20, 20, 30, 0.08)" />
      <stop offset="100%" stop-color="rgba(20, 20, 30, 0.0)" />
    </radialGradient>

    <!-- Protein Tub Gradients (#6B0F1A Maroon) -->
    <linearGradient id="proteinTub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A0A12" />
      <stop offset="35%" stop-color="#6B0F1A" />
      <stop offset="75%" stop-color="#801522" />
      <stop offset="100%" stop-color="#3D0710" />
    </linearGradient>

    <linearGradient id="blackCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B2B2B" />
      <stop offset="40%" stop-color="#4F4F4F" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>

    <!-- Shaker Bottle Semi-Translucent Gradient -->
    <linearGradient id="shakerBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E0E0" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#F5F5F5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CCCCCC" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Ground Shadows -->
  <ellipse cx="440" cy="740" rx="300" ry="70" fill="url(#groundShadow)" />
  <ellipse cx="650" cy="720" rx="180" ry="55" fill="url(#groundShadow)" opacity="0.8" />

  <!-- Rear/Main Protein Jar (#6B0F1A) -->
  <g id="protein-jar" transform="translate(230, 240)">
    <!-- Base Body -->
    <path d="M 30,140 L 30,460 A 170,45 0 0,0 370,460 L 370,140 Z" fill="url(#proteinTub)" stroke="#3D0710" stroke-width="2" />
    <ellipse cx="200" cy="460" rx="170" ry="42" fill="url(#proteinTub)" />

    <!-- Silver Gold Foil Rim -->
    <rect x="50" y="110" width="300" height="32" rx="8" fill="url(#blackCap)" />

    <!-- Screw Lid -->
    <ellipse cx="200" cy="70" rx="180" ry="40" fill="url(#blackCap)" />
    <path d="M 20,70 L 20,115 A 180,40 0 0,0 380,115 L 380,70 Z" fill="url(#blackCap)" />

    <!-- Specular Highlight -->
    <rect x="100" y="145" width="45" height="310" fill="#FFFFFF" opacity="0.2" rx="10" />
  </g>

  <!-- Front Shaker Bottle -->
  <g id="shaker-bottle" transform="translate(540, 360)">
    <!-- Shaker Body -->
    <path d="M 20,100 L 35,320 A 75,25 0 0,0 185,320 L 200,100 Z" fill="url(#shakerBody)" stroke="#BDBDBD" stroke-width="2" />
    <ellipse cx="110" cy="320" rx="75" ry="22" fill="url(#shakerBody)" stroke="#CCCCCC" />

    <!-- Ounce / ml Measurement Lines -->
    <line x1="45" y1="150" x2="65" y2="150" stroke="#757575" stroke-width="2" />
    <line x1="48" y1="180" x2="72" y2="180" stroke="#757575" stroke-width="3" />
    <line x1="52" y1="210" x2="72" y2="210" stroke="#757575" stroke-width="2" />
    <line x1="55" y1="240" x2="80" y2="240" stroke="#757575" stroke-width="3" />
    <line x1="58" y1="270" x2="78" y2="270" stroke="#757575" stroke-width="2" />

    <!-- Shaker Lid (Maroon #6B0F1A) -->
    <rect x="10" y="70" width="200" height="35" rx="10" fill="url(#proteinTub)" stroke="#3D0710" />
    <!-- Dome Top & Flip Cap -->
    <ellipse cx="110" cy="70" rx="90" ry="25" fill="url(#proteinTub)" />
    <path d="M 70,70 Q 110,20 150,70 Z" fill="url(#proteinTub)" />
    <circle cx="110" cy="35" r="14" fill="#F4E409" />
  </g>
</svg>
