<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Studio Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#E2E2E6" />
    </radialGradient>
    
    <!-- Ground Shadows -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20, 20, 30, 0.30)" />
      <stop offset="60%" stop-color="rgba(20, 20, 30, 0.08)" />
      <stop offset="100%" stop-color="rgba(20, 20, 30, 0.0)" />
    </radialGradient>

    <!-- Sportswear Fabric Gradients -->
    <linearGradient id="jerseyBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212529" />
      <stop offset="50%" stop-color="#343A40" />
      <stop offset="100%" stop-color="#18191A" />
    </linearGradient>

    <linearGradient id="accentYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#F4E409" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Studio Soft Ground Shadow -->
  <ellipse cx="512" cy="740" rx="360" ry="85" fill="url(#groundShadow)" />

  <!-- Folded Track Pants (Bottom Layer) -->
  <g id="folded-track-pants" transform="translate(230, 480)">
    <rect x="0" y="0" width="564" height="210" rx="28" fill="#1C1D21" stroke="#343A40" stroke-width="2" />
    <!-- Tapered Athletic Side Stripe -->
    <path d="M 0 35 H 564" stroke="url(#accentYellow)" stroke-width="12" />
    <path d="M 0 65 H 564" stroke="#6B0F1A" stroke-width="8" />
  </g>

  <!-- Folded Sportswear Jersey / Jacket (Top Layer) -->
  <g id="folded-jersey" transform="translate(260, 270)">
    <rect x="0" y="0" width="504" height="270" rx="26" fill="url(#jerseyBase)" stroke="#212529" stroke-width="2" />
    <!-- Sporty V-Neck / Collar -->
    <path d="M 180 0 L 252 85 L 324 0" fill="#6B0F1A" stroke="url(#accentYellow)" stroke-width="4" />
    
    <!-- Central Metallic Zipper Line -->
    <line x1="252" y1="85" x2="252" y2="270" stroke="#CCCCCC" stroke-width="5" stroke-dasharray="6 4" />
    <circle cx="252" cy="95" r="7" fill="url(#accentYellow)" />

    <!-- Sleeve / Shoulder Accents -->
    <path d="M 0 0 L 100 270" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
    <path d="M 504 0 L 404 270" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
    
    <!-- Side Contrast Panels -->
    <path d="M 0 90 Q 50 180 0 270" fill="url(#accentYellow)" opacity="0.9" />
    <path d="M 504 90 Q 454 180 504 270" fill="url(#accentYellow)" opacity="0.9" />
  </g>
</svg>
